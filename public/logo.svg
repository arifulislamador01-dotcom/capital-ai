<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Circle Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" />
  
  <!-- Inner Light Circle -->
  <circle cx="100" cy="100" r="85" fill="#ffffff" opacity="0.1" />
  
  <!-- Brain-AI Shape (Top) -->
  <g transform="translate(100, 65)">
    <!-- Brain Hemispheres -->
    <path d="M -20 0 Q -20 -15 -10 -20 Q 0 -22 10 -20 Q 20 -15 20 0" fill="url(#accentGradient)" />
    
    <!-- Neural Network Dots -->
    <circle cx="-12" cy="-15" r="2.5" fill="#fbbf24" />
    <circle cx="0" cy="-18" r="2.5" fill="#fbbf24" />
    <circle cx="12" cy="-15" r="2.5" fill="#fbbf24" />
    
    <!-- Connection Lines -->
    <line x1="-12" y1="-15" x2="0" y2="-18" stroke="#fbbf24" stroke-width="1.5" opacity="0.7" />
    <line x1="0" y1="-18" x2="12" y2="-15" stroke="#fbbf24" stroke-width="1.5" opacity="0.7" />
    <line x1="-12" y1="-15" x2="12" y2="-15" stroke="#fbbf24" stroke-width="1.5" opacity="0.5" />
  </g>
  
  <!-- Capital/Dollar Symbol (Bottom) -->
  <g transform="translate(100, 110)">
    <!-- Stylized "C" with Dollar effect -->
    <path d="M -15 -12 Q -22 -8 -22 0 Q -22 8 -15 12 L -8 12 L -8 10 Q -18 8 -18 0 Q -18 -8 -8 -10 L -8 -12 Z" 
          fill="white" />
    <line x1="-10" y1="-15" x2="-10" y2="15" stroke="white" stroke-width="2" />
  </g>
  
  <!-- Decorative Rings -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.3" />
  <circle cx="100" cy="100" r="80" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.2" />
  
  <!-- Corner Accent Elements -->
  <g opacity="0.4">
    <circle cx="30" cy="30" r="3" fill="#fbbf24" />
    <circle cx="170" cy="30" r="3" fill="#fbbf24" />
    <circle cx="30" cy="170" r="3" fill="#fbbf24" />
    <circle cx="170" cy="170" r="3" fill="#fbbf24" />
  </g>
</svg>
