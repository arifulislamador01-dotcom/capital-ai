<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#grad1)" rx="20" />
  
  <!-- AI Brain Icon -->
  <g transform="translate(100, 75)">
    <!-- Left lobe -->
    <ellipse cx="-14" cy="0" rx="10" ry="14" fill="url(#grad2)" />
    <!-- Right lobe -->
    <ellipse cx="14" cy="0" rx="10" ry="14" fill="url(#grad2)" />
    <!-- Connecting bridge -->
    <rect x="-6" y="-3" width="12" height="6" fill="url(#grad2)" rx="2" />
    
    <!-- Neural dots -->
    <circle cx="-14" cy="-12" r="2" fill="#fbbf24" />
    <circle cx="0" cy="-14" r="2" fill="#fbbf24" />
    <circle cx="14" cy="-12" r="2" fill="#fbbf24" />
    <circle cx="-10" cy="12" r="1.5" fill="#ffffff" />
    <circle cx="0" cy="13" r="1.5" fill="#ffffff" />
    <circle cx="10" cy="12" r="1.5" fill="#ffffff" />
  </g>
  
  <!-- Capital Symbol -->
  <g transform="translate(100, 135)">
    <text x="0" y="0" font-size="32" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
      CA
    </text>
  </g>
  
  <!-- Accent line -->
  <line x1="40" y1="150" x2="160" y2="150" stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-linecap="round" />
</svg>
