<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Main Background Circle -->
  <circle cx="128" cy="128" r="115" fill="url(#mainGradient)" />
  
  <!-- Inner Glow -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1" />
  
  <!-- Main Icon Group -->
  <g filter="url(#shadow)">
    <!-- Brain Symbol (AI) -->
    <g transform="translate(128, 80)">
      <!-- Left Brain Hemisphere -->
      <path d="M -18 -8 Q -25 -4 -25 8 L -18 8 Q -20 4 -20 0 Q -20 -4 -18 -8 Z" fill="url(#accentGradient)" />
      
      <!-- Right Brain Hemisphere -->
      <path d="M 18 -8 Q 25 -4 25 8 L 18 8 Q 20 4 20 0 Q 20 -4 18 -8 Z" fill="url(#accentGradient)" />
      
      <!-- Center Connection -->
      <rect x="-4" y="-8" width="8" height="16" fill="url(#accentGradient)" rx="2" />
      
      <!-- Neural Nodes - Top -->
      <circle cx="-12" cy="-14" r="3" fill="#fbbf24" />
      <circle cx="0" cy="-16" r="3" fill="#fbbf24" />
      <circle cx="12" cy="-14" r="3" fill="#fbbf24" />
      
      <!-- Neural Nodes - Bottom -->
      <circle cx="-10" cy="14" r="2.5" fill="#ffffff" opacity="0.8" />
      <circle cx="0" cy="15" r="2.5" fill="#ffffff" opacity="0.8" />
      <circle cx="10" cy="14" r="2.5" fill="#ffffff" opacity="0.8" />
      
      <!-- Connection Lines -->
      <line x1="-12" y1="-14" x2="-4" y2="-8" stroke="#fbbf24" stroke-width="1.5" opacity="0.6" />
      <line x1="0" y1="-16" x2="0" y2="-8" stroke="#fbbf24" stroke-width="1.5" opacity="0.6" />
      <line x1="12" y1="-14" x2="4" y2="-8" stroke="#fbbf24" stroke-width="1.5" opacity="0.6" />
    </g>
    
    <!-- Capital Symbol -->
    <g transform="translate(128, 148)">
      <!-- Stylized C -->
      <path d="M 0 -22 Q -20 -22 -20 0 Q -20 22 0 22 L 8 22 L 8 16 Q -15 16 -15 0 Q -15 -16 8 -16 L 8 -22 Z" 
            fill="white" stroke="none" />
      
      <!-- Dollar line through -->
      <line x1="-2" y1="-28" x2="-2" y2="28" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round" />
      
      <!-- Horizontal dollar marks -->
      <line x1="-8" y1="-15" x2="4" y2="-15" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <line x1="-8" y1="15" x2="4" y2="15" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    </g>
  </g>
  
  <!-- Decorative Elements -->
  <!-- Outer Ring -->
  <circle cx="128" cy="128" r="115" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.2" />
  
  <!-- Accent Dots -->
  <g fill="#fbbf24" opacity="0.4">
    <circle cx="48" cy="48" r="2.5" />
    <circle cx="208" cy="48" r="2.5" />
    <circle cx="48" cy="208" r="2.5" />
    <circle cx="208" cy="208" r="2.5" />
  </g>
  
  <!-- Subtle sparkles -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="70" cy="60" r="1.5" />
    <circle cx="186" cy="70" r="1.5" />
    <circle cx="75" cy="190" r="1.5" />
    <circle cx="180" cy="185" r="1.5" />
  </g>
</svg>
